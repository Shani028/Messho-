name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Public Maven Compatible Config for GitHub Runner
        run: |
          # Ensure .env exists
          [ -f .env ] || cp .env.example .env
          # Ensure debug.keystore exists
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Provide fallback string resources if google-services.json or firebase_applet_config.xml were excluded during export
          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-shipsave-d36d7bf5-06b3-4b78-af20-79a4be5bee69</string>
          </resources>
          EOF
          fi
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/src/main/res/values/google_services_fallback.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">123182853804-7vutf91nisjp18f40vqrq5h6i4qqd58i.apps.googleusercontent.com</string>
          </resources>
          EOF
          fi
          # Patch compileSdk/targetSdk and catalog versions to public Maven stable releases on GitHub runner
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
          sed -i 's/agp = "9.1.1"/agp = "8.7.3"/g' gradle/libs.versions.toml
          sed -i 's/coreKtx = "1.18.0"/coreKtx = "1.15.0"/g' gradle/libs.versions.toml
          sed -i 's/kotlin = "2.2.10"/kotlin = "2.0.21"/g' gradle/libs.versions.toml
          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.0.21-1.0.28"/g' gradle/libs.versions.toml
          sed -i 's/firebaseBom = "34.17.0"/firebaseBom = "33.10.0"/g' gradle/libs.versions.toml
          sed -i 's/googleServices = "4.5.0"/googleServices = "4.4.2"/g' gradle/libs.versions.toml
          sed -i 's/robolectric = "4.16.1"/robolectric = "4.14.1"/g' gradle/libs.versions.toml
          sed -i 's/junitVersion = "1.3.0"/junitVersion = "1.2.1"/g' gradle/libs.versions.toml
          sed -i 's/espressoCore = "3.7.0"/espressoCore = "3.6.1"/g' gradle/libs.versions.toml
          sed -i 's/gradle-9.3.1-bin.zip/gradle-8.11.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meesho-ShipSmart-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Latest GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Meesho ShipSmart APK Release
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
